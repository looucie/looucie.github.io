    <script>

const cursor = document.querySelector('.custom-cursor');

document.addEventListener('mousemove', function (e) {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

document.querySelectorAll('a, button').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('is-pointer'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('is-pointer'));
});


const burger = document.getElementById('burger');
const overlay = document.getElementById('nav-overlay');

function toggleMenu(force) {
  const isOpen = force !== undefined ? force : !burger.classList.contains('open');
  burger.classList.toggle('open', isOpen);
  overlay.classList.toggle('open', isOpen);
  burger.setAttribute('aria-expanded', isOpen);
}

burger.addEventListener('click', () => toggleMenu());
document.getElementById('overlay-close').addEventListener('click', () => toggleMenu(false));

overlay.querySelectorAll('.overlay-link').forEach(link => {
  link.addEventListener('click', () => toggleMenu(false));
});

        document.fonts.ready.then(function () {
            const track = document.getElementById('marquee-track');
            const original = document.getElementById('marquee-original');

            const clone = original.cloneNode(true);
            clone.setAttribute('aria-hidden', 'true');
            track.appendChild(clone);

            const contentWidth = original.offsetWidth;
            let x = 0;

            function animate() {
                x -= 0.25;
                if (x <= -contentWidth) x = 0;
                track.style.transform = `translateX(${x}px)`;
                requestAnimationFrame(animate);
            }

            animate();
        });
       </script>
