<script>
    var projet = document.getElementsByClassName("projet");
    var boutons = document.getElementById("choix").getElementsByTagName("button");

    for (let i = 0; i < boutons.length; i++) {
        boutons[i].addEventListener("click", function () {
            var category = this.id;
            boutons[i].classList.add("choisi");

            for (let j = 0; j < projet.length; j++) {
                var projetButton = projet[j].getElementsByTagName("button")[0];
                if (projetButton.id === category || category === "all") {
                    projet[j].classList.remove("hidden");
                } else {
                    projet[j].classList.add("hidden");
                }
            }
        });
    }



</script>
